category: "layers"
name: "X-v3"
version: 26.08+4
uri:
  - https://mocaccino.org
license: "Multiple (GPL-2, LGPL, MIT, BSD, Apache-2, Artistic)"
description: "x86-64-v3 (AVX2/FMA) optimized builds of performance-critical graphics and media libraries from layers/X, installed to glibc-hwcaps for automatic runtime selection on supporting CPUs. Optional layer — falls back transparently to layers/X on unsupported hardware."
labels:
  emerge.jobs: "10"
  # Graphics / GPU stack
  # Video / codecs
  # Audio DSP
  emerge.packages: >-
    media-libs/mesa media-libs/vulkan-loader media-libs/libepoxy media-libs/libglvnd media-libs/glew media-video/ffmpeg media-libs/openal media-libs/speexdsp media-libs/libsamplerate media-libs/soxr media-sound/sox
requires:
  - category: "layers"
    name: "X"
    version: ">=0"
