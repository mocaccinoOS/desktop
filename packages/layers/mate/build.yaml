excludes:
{{ template "portage_excludes" }}
env:
{{ template "portage_env" . }}
prelude:
{{ template "portage_copy_package_files" . }}
{{ template "portage_prelude_build" . }}
steps:
- qlist -Iv | sort > /var/tmp/layer.before
{{ template "portage_build" . }}
{{ template "housekeeping" . }}
- qlist -Iv | sort > /var/tmp/layer.after
- LC_ALL=C comm -13 /.layer.before /.layer.after > /usr/share/mocaccino/packagelists/{{ .Values.category }}-{{ .Values.name }}-{{ .Values.version }}.added
- LC_ALL=C comm -23 /.layer.before /.layer.after > /usr/share/mocaccino/packagelists/{{ .Values.category }}-{{ .Values.name }}-{{ .Values.version }}.removed
- rm -f /var/tmp/layer.before /var/tmp/layer.after
requires:
- category: "layers"
  name: "gnome-common"
  version: ">=0"
