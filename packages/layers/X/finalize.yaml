install:
  - glib-compile-schemas /usr/share/glib-2.0/schemas > /dev/null 2>&1
  - ldconfig
  # During migration to pipewire a broken symlink in
  # /etc/alsa/conf.d (10-samplerate.conf) prevents
  # pipewire from working properly
  - find /etc/alsa/conf.d -xtype l -delete
  # Automerge the shipped fontconfig files (user overrides live in /etc/fonts/conf.d, not conf.avail)
  - "mos config-update update --interactive=false -p /etc/fonts/conf.avail 2>&1 | grep -v -e '^ERROR: 0 errors' -e '^$' -e '^Latest changeset' -e '^Merging configuration' -e '^Unmerged configuration' || true"
