install:
- mos config-update update --interactive=false -p /etc/ld.so.conf.d
- hash -r
- touch /var/lib/portage/.keep
# Since we do not ship /etc/portage we must make sure to set CHOST in env. gcc-config requires this and is called when we generated dracut images
- if [ ! -f /etc/profile.d/mocaccino.sh ]; then { echo "unset CHOST"; echo "CHOST=\"x86_64-pc-linux-gnu\""; echo export CHOST; } >> /etc/profile.d/mocaccino.sh; fi
- chmod 4750 /usr/libexec/dbus-daemon-launch-helper
- chmod u+s /usr/bin/su
- chmod +s /usr/lib/polkit-1/polkit-agent-helper-1
# Default to Europe/Rome unless the user already has a timezone set (the -L check covers dangling symlinks)
- if [ ! -e /etc/localtime ] && [ ! -L /etc/localtime ]; then ln -s /usr/share/zoneinfo/Europe/Rome /etc/localtime; fi
# Keep the user's locale files: drop vanilla ._cfg copies so etc-update can't overwrite them
- rm -f /etc/._cfg????_locale.conf /etc/._cfg????_locale.gen
# ca-certificates: Luet has no CONFIG_PROTECT_MASK, so resolve the leftovers here. The .crt is generated, the .conf is merged
- rm -f /etc/ssl/certs/._cfg????_ca-certificates.crt
- for f in /etc/._cfg????_ca-certificates.conf; do if [ -f "$f" ]; then mv -f "$f" /etc/ca-certificates.conf; fi; done
- if command -v update-ca-certificates >/dev/null 2>&1; then update-ca-certificates >/dev/null 2>&1; fi
# Automerge these config files (only the harmless "ERROR: 0 errors" noise is filtered, real errors stay visible)
- "mos config-update update --interactive=false -p /etc/dnssec 2>&1 | grep -v -e '^ERROR: 0 errors' -e '^$' -e '^Latest changeset' -e '^Merging configuration' -e '^Unmerged configuration' || true"
# Merge trivial changes first, so env.d updates are picked up by env-update below
- etc-update -p
- ldconfig
- source /etc/profile > /dev/null 2>&1 && env-update > /dev/null 2>&1