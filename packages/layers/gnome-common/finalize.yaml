install:
- glib-compile-schemas /usr/share/glib-2.0/schemas > /dev/null 2>&1
- ldconfig
# Automerge the shipped vte profile.d snippet (only vte-*.sh, never the whole profile.d)
- for f in /etc/profile.d/._cfg????_vte-*.sh; do if [ -f "$f" ]; then mv -f "$f" "/etc/profile.d/$(basename "$f" | cut -c10-)"; fi; done