category: "apps"
name: "meshcore-cli"
# version: "1.6.6"
version: "0.1"
uri:
  - https://github.com/meshcore-dev/meshcore-cli
license: "BSD MIT"
description: "CLI interface to MeshCore companion app over BLE, TCP or Serial"
labels:
  emerge.jobs: "1"
  emerge.packages: "dev-python/bleak::mocaccino-overlay dev-python/dbus-fast dev-python/meshcore::mocaccino-overlay dev-python/meshcore-cli::mocaccino-overlay dev-python/pycayennelpp::mocaccino-overlay dev-python/pyserial-asyncio-fast::mocaccino-overlay"
  description: "CLI interface to MeshCore companion app over BLE, TCP or Serial"
provides:
  - name: bleak
    category: dev-python
    version: '>=0'
  - name: dbus-fast
    category: dev-python
    version: '>=0'
  - name: pyserial-asyncio-fast
    category: dev-python
    version: '>=0'
  - name: pycayennelpp
    category: dev-python
    version: '>=0'
  - name: meshcore
    category: dev-python
    version: '>=0'
  - name: meshcore-cli
    category: dev-python
    version: '>=0'
requires:
  - category: "layers"
    name: "sys-fs"
    version: ">=0"
